<style>
:root{
  --bg:#eef2f6;--surface:#ffffff;--surface2:#f3f6fa;--text:#14202e;--muted:#526274;--line:#d3dce6;
  --accent:#1d3a6b;--on-accent:#ffffff;--accent-soft:#dde7f5;
  --warm:#a84f06;--warm-soft:#fbebd8;--danger:#b3261e;--danger-soft:#fbe4e2;--ok:#1f7a4d;
  --radius:14px;--shadow:0 1px 2px rgba(20,32,46,.06);
  --font-h:'Literata',Georgia,serif;--font-b:'Manrope',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1621;--surface:#162130;--surface2:#1b2838;--text:#e7edf4;--muted:#9fb0c2;--line:#2a3a4d;
    --accent:#8fb4f0;--on-accent:#0b1829;--accent-soft:#213552;
    --warm:#f2a24f;--warm-soft:#3b2a16;--danger:#f4958d;--danger-soft:#3d1f1d;--ok:#6fcf9d;
    --shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1621;--surface:#162130;--surface2:#1b2838;--text:#e7edf4;--muted:#9fb0c2;--line:#2a3a4d;
  --accent:#8fb4f0;--on-accent:#0b1829;--accent-soft:#213552;
  --warm:#f2a24f;--warm-soft:#3b2a16;--danger:#f4958d;--danger-soft:#3d1f1d;--ok:#6fcf9d;
  --shadow:none;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--font-b);font-variant-numeric:tabular-nums;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;padding-block:16px calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
#app.nobar{padding-block-end:32px}
h1,h2,h3{font-family:var(--font-h);margin:0;line-height:1.2}
h1{font-size:26px;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.top .date{font-size:13px;color:var(--muted)}
.stack>*+*{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card.warm{border-color:var(--warm);background:var(--warm-soft)}
.card.err{border-color:var(--danger);background:var(--danger-soft)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.tile b{display:block;font:700 20px/1.1 var(--font-h)}
.tile span{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none;text-align:center}
.btn.sec{background:transparent;color:var(--accent)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-height:64px}
.row.done{background:var(--accent-soft);border-color:var(--accent-soft)}
.chk{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--muted);background:var(--surface);display:grid;place-items:center;color:var(--on-accent)}
.chk svg{width:24px;height:24px;opacity:0}
.row.done .chk{background:var(--accent);border-color:var(--accent)}
.row.done .chk svg{opacity:1}
.row .ttl{flex:1;min-width:0}
.row .ttl b{display:block;font-size:17px;font-weight:600}
.row.done .ttl b{color:var(--muted);text-decoration:line-through}
.row .ttl small{color:var(--muted);font-size:12px}
.row a.open{flex:none;min-height:40px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-radius:10px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;background:var(--surface)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:var(--muted);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px}
textarea.inp{padding:10px 12px;min-height:84px;resize:vertical}
.inp[disabled]{opacity:.6}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field+.field{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabbar div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar button{border:0;background:transparent;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] span{border-bottom:2px solid var(--warm)}
.coll{width:100%;display:block;text-align:left;background:transparent;border:0;padding:0}
.coll .h{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px}
.coll .h b{font:700 17px var(--font-h)}
.chev{display:inline-block;transition:transform .15s;margin-right:6px}
.coll[aria-expanded="true"] .chev{transform:rotate(90deg)}
.book{margin-top:12px}
.book .bh{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px}
.cells{display:flex;flex-wrap:wrap;gap:4px}
.cell{width:32px;height:32px;min-width:28px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted)}
.cell.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cell.today{box-shadow:0 0 0 2px var(--warm);border-color:var(--warm)}
.hexrow{display:flex;height:27px;margin-bottom:0}
.hexrow.odd{margin-left:16px}
.hex{position:relative;flex:none;width:30px;height:34px;margin-right:2px;padding:0;border:0;background:var(--line);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-size:11px;font-weight:700;color:var(--muted)}
.hex i{position:absolute;inset:2px;background:var(--surface2);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font-style:normal}
.hex.on i{background:var(--accent);color:var(--on-accent)}
.hex:focus-visible{outline:none;background:var(--accent)}
.hex:focus-visible i{inset:4px}
.hex.today{background:var(--warm)}
.hexwrap{padding-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;padding-left:8px}
.chip button{border:0;background:transparent;min-width:30px;min-height:34px;font-size:18px;color:var(--accent);padding:0 4px}
.chip button.x{color:var(--danger)}
.chip span{padding:0 2px}
table.bal{width:100%;border-collapse:collapse;font-size:14px}
table.bal th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:4px 0}
table.bal td{padding:5px 0;border-top:1px solid var(--line)}
table.bal td:not(:first-child),table.bal th:not(:first-child){text-align:right}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv b{font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:15px}
.opt small{color:var(--muted);font-size:13px}
.opt+.opt{margin-top:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:6px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.prow label{display:flex;align-items:center;gap:8px;font-size:14px;min-height:36px}
.prow input[type=checkbox],.cb input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.cb{display:flex;align-items:center;gap:10px;min-height:44px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw}
.warnline{color:var(--warm);font-weight:600;font-size:14px;margin-top:8px}
.errline{color:var(--danger);font-weight:600;font-size:14px}
.sticky-act{position:sticky;bottom:12px;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}
@media (max-width:359px){.tiles{gap:6px}.tile b{font-size:17px}}
</style>

<script>
(function(){
'use strict';
/* ===== Данные ===== */
var KEY = 'bible-plan-v1';
var CAP = 200000;
var CATS = [
  {id:'law',name:'Закон'},{id:'hist',name:'Исторические'},{id:'poetry',name:'Поэзия и мудрость'},
  {id:'prophets',name:'Пророки'},{id:'gospels',name:'Евангелия'},{id:'acts',name:'Деяния'},
  {id:'epistles',name:'Послания и Откровение'}
];
var RAW = [
  ['gen','Бытие',50,1,'law'],['exo','Исход',40,2,'law'],['lev','Левит',27,3,'law'],['num','Числа',36,4,'law'],['deu','Второзаконие',34,5,'law'],
  ['jos','Иисуса Навина',24,6,'hist'],['jdg','Судей',21,7,'hist'],['rut','Руфь',4,8,'hist'],['1sa','1 Царств',31,9,'hist'],['2sa','2 Царств',24,10,'hist'],
  ['1ki','3 Царств',22,11,'hist'],['2ki','4 Царств',25,12,'hist'],['1ch','1 Паралипоменон',29,13,'hist'],['2ch','2 Паралипоменон',36,14,'hist'],
  ['ezr','Ездры',10,15,'hist'],['neh','Неемии',13,16,'hist'],['est','Есфирь',10,17,'hist'],
  ['job','Иова',42,18,'poetry'],['psa','Псалтирь',150,19,'poetry'],['pro','Притчи',31,20,'poetry'],['ecc','Екклесиаст',12,21,'poetry'],['sng','Песня Песней',8,22,'poetry'],
  ['isa','Исаия',66,23,'prophets'],['jer','Иеремия',52,24,'prophets'],['lam','Плач Иеремии',5,25,'prophets'],['eze','Иезекииль',48,26,'prophets'],['dan','Даниил',12,27,'prophets'],
  ['hos','Осия',14,28,'prophets'],['joe','Иоиль',3,29,'prophets'],['amo','Амос',9,30,'prophets'],['oba','Авдий',1,31,'prophets'],['jon','Иона',4,32,'prophets'],
  ['mic','Михей',7,33,'prophets'],['nah','Наум',3,34,'prophets'],['hab','Аввакум',3,35,'prophets'],['zep','Софония',3,36,'prophets'],['hag','Аггей',2,37,'prophets'],
  ['zec','Захария',14,38,'prophets'],['mal','Малахия',4,39,'prophets'],
  ['mat','Матфея',28,40,'gospels'],['mrk','Марка',16,41,'gospels'],['luk','Луки',24,42,'gospels'],['jhn','Иоанна',21,43,'gospels'],
  ['act','Деяния',28,44,'acts'],
  ['rom','Римлянам',16,45,'epistles'],['1co','1 Коринфянам',16,46,'epistles'],['2co','2 Коринфянам',13,47,'epistles'],['gal','Галатам',6,48,'epistles'],
  ['eph','Ефесянам',6,49,'epistles'],['php','Филиппийцам',4,50,'epistles'],['col','Колоссянам',4,51,'epistles'],['1th','1 Фессалоникийцам',5,52,'epistles'],
  ['2th','2 Фессалоникийцам',3,53,'epistles'],['1ti','1 Тимофею',6,54,'epistles'],['2ti','2 Тимофею',4,55,'epistles'],['tit','Титу',3,56,'epistles'],
  ['phm','Филимону',1,57,'epistles'],['heb','Евреям',13,58,'epistles'],['jas','Иакова',5,59,'epistles'],['1pe','1 Петра',5,60,'epistles'],['2pe','2 Петра',3,61,'epistles'],
  ['1jn','1 Иоанна',5,62,'epistles'],['2jn','2 Иоанна',1,63,'epistles'],['3jn','3 Иоанна',1,64,'epistles'],['jud','Иуды',1,65,'epistles'],['rev','Откровение',22,66,'epistles']
];
var books = RAW.map(function (r) { return {id:r[0],name:r[1],ch:r[2],n:r[3],cat:r[4]}; });
var bookById = {};
books.forEach(function (b) { bookById[b.id] = b; });
var TOTAL_CH = books.reduce(function (s, b) { return s + b.ch; }, 0);
var catName = {};
CATS.forEach(function (c) { catName[c.id] = c.name; });

function catBooks(cats) {
  return books.filter(function (b) { return cats.indexOf(b.cat) >= 0; }).map(function (b) { return b.id; });
}
var PRESET_DEFS = {
  '7': {label:'7 разделов', defs:[['Закон',['law']],['Исторические',['hist']],['Поэзия и мудрость',['poetry']],['Пророки',['prophets']],['Евангелия',['gospels']],['Деяния',['acts']],['Послания',['epistles']]]},
  '5': {label:'5 разделов', defs:[['Закон',['law']],['Исторические',['hist']],['Поэзия и мудрость',['poetry']],['Пророки',['prophets']],['Новый Завет',['gospels','acts','epistles']]]},
  '6': {label:'6 разделов', defs:[['Закон',['law']],['Исторические',['hist']],['Поэзия и мудрость',['poetry']],['Пророки',['prophets']],['Евангелия и Деяния',['gospels','acts']],['Послания',['epistles']]]},
  'custom': {label:'Свой', defs:null}
};
var presets = {};
Object.keys(PRESET_DEFS).forEach(function (k) {
  var d = PRESET_DEFS[k];
  presets[k] = {
    label: d.label,
    streams: d.defs ? d.defs.map(function (x, i) { return {id:'s' + (i + 1), name:x[0], books:catBooks(x[1])}; })
                    : [{id:'s1', name:'Раздел 1', books:[]}]
  };
});
function copyStreams(list) {
  return list.map(function (s) { return {id:s.id, name:s.name, books:s.books.slice()}; });
}
function makeStreams(key) { return copyStreams((presets[key] || presets['7']).streams); }
function rotateBooks(list, bookId) {
  var i = list.indexOf(bookId);
  if (i <= 0) return list.slice();
  return list.slice(i).concat(list.slice(0, i));
}

/* ===== Даты ===== */
var todayOverride = null;
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function today() {
  if (todayOverride) return todayOverride;
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function setToday(iso) { todayOverride = (iso && parseISO(iso) != null) ? iso : null; }
function parseISO(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return null;
  var t = Date.UTC(+m[1], +m[2] - 1, +m[3]), d = new Date(t);
  if (d.getUTCFullYear() !== +m[1] || d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[3]) return null;
  return t;
}
function addDays(s, n) {
  var d = new Date(parseISO(s) + n * 864e5);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}
function diffDays(a, b) { return Math.round((parseISO(a) - parseISO(b)) / 864e5); }
var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function fmtDate(iso, withYear) {
  var t = parseISO(iso);
  if (t == null) return '';
  try {
    var o = {timeZone:'UTC', day:'numeric', month:'long'};
    if (withYear) o.year = 'numeric';
    return new Date(t).toLocaleDateString('ru-RU', o);
  } catch (e) { return iso; }
}
function plural(n, f) {
  var a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return f[2];
  if (b > 1 && b < 5) return f[1];
  if (b === 1) return f[0];
  return f[2];
}
function fmtNum(x, d) {
  var s = (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
  return s.replace('.', ',');
}

/* ===== Главы: разбор и форматирование ===== */
function parseChapters(text, max) {
  var set = {};
  String(text || '').split(/[,;\s]+/).forEach(function (part) {
    if (!part) return;
    var m = /^(\d+)\s*[-–—]\s*(\d+)$/.exec(part);
    var a, b;
    if (m) { a = +m[1]; b = +m[2]; if (a > b) { var t = a; a = b; b = t; } }
    else if (/^\d+$/.test(part)) { a = b = +part; }
    else return;
    for (var i = Math.max(1, a); i <= Math.min(max, b); i++) set[i] = 1;
  });
  return Object.keys(set).map(Number).sort(function (x, y) { return x - y; });
}

/* ===== Ядро построения плана ===== */

function core(params, bk, read) {

    items.sort(function (a, b) {

function buildPlan(params, a2, a3) {

    var kk = x.book + ':' + x.ch;
    seen[kk] = (seen[kk] || 0) + 1;
    slots[i] = {key:kk + '#' + seen[kk], book:x.book, ch:x.ch, stream:st.id, si:c.S[i], day:day};

/* кэш построенных планов */

/* ===== Проверка и баланс ===== */
function validate(params) {

  var D = +params.days;
  if (!(Number.isInteger(D) && D >= 1 && D <= 3650)) errs.push('Срок: целое число дней от 1 до 3650.');
  if (params.finish !== 'proportional' && !(+params.rate > 0)) errs.push('Скорость должна быть больше нуля.');
  if (params.finish !== 'proportional' && +params.rate > 100) errs.push('Не больше 100 глав в день.');
  if (params.finish === 'proportional' && Number.isInteger(D) && D >= 1 && 1189 / D > 100) errs.push('Не больше 100 глав в день: увеличьте срок.');
  if (parseISO(params.startDate) == null) errs.push('Укажите дату начала.');
  return errs;
}

  if (!errs.length && c.S.length === 0) errs.push('В плане не осталось глав для чтения.');

    var st = params.streams[i];

    return {

      timesText:L.length ? fmtNum(times, 1) : '0,0',

  var q = p.params;

    return {id:String(s.id || 's' + (i + 1)), name:String(s.name || 'Раздел ' + (i + 1)), books:s.books.filter(function (id) { return bookById[id]; })};
  });

/* ----- План ----- */
function streamStats(plan, st) {
  var tot = 0, rd = 0;
  st.books.forEach(function (id) {
    var b = bookById[id];
    if (!b) return;
    tot += b.ch;
    for (var c = 1; c <= b.ch; c++) if (plansDone(plan, id, c)) rd++;
  });
  return {tot:tot, rd:rd};
}
function hexPerRow() {
  var w = $('screen').clientWidth || 360;

}
function bookCells(plan, id, todaySet) {
  var b = bookById[id], rd = 0, h = '';

  for (var c = 1; c <= b.ch; c++) {
    var on = plansDone(plan, id, c), td = todaySet[id + ':' + c];

    if (per) {

      h += '<button type="button" class="hex' + cls + '"' + attrs + '><i>' + c + '</i></button>';

}
function planHTML(plan) {

  h += '<div class="card"><h3 style="margin-bottom:8px">Если день пропущен</h3>' + POLICIES.map(function (o) { return '<button type="button" class="opt" data-act="wset" data-k="missed" data-v="' + o.v + '" aria-pressed="' + (d.missed === o.v) + '"><b>' + o.t + '</b><small>' + o.d + '</small></button>'; }).join('') + '</div>';
  var preN = draftPre(d).length;
  h += '<div class="card"><h3 style="margin-bottom:4px">Уже прочитано</h3><p class="small muted">Отмечено глав: <span id="preN">' + preN + '</span></p>' +
    '<label class="cb"><input type="checkbox" data-w="skip"' + (d.skipRead ? ' checked' : '') + '><span>Пропускать эти главы в плане</span></label>' +
    '<button type="button" class="btn sec block" data-act="ptoggle" aria-expanded="' + ui.preOpen + '">' + (ui.preOpen ? 'Скрыть список книг' : 'Отметить по книгам') + '</button>';
  if (ui.preOpen) {
    books.forEach(function (b) {
      var arr = d.pre[b.id] || [];
      h += '<div class="prow"><label><input type="checkbox" data-w="pfull" data-b="' + b.id + '"' + (arr.length === b.ch ? ' checked' : '') + '><span>' + esc(b.name) + ' <small class="muted">(' + b.ch + ')</small></span></label>' +
        '<input class="inp" style="min-height:38px" data-w="ptxt" data-b="' + b.id + '" value="' + esc(formatRanges(arr)) + '" placeholder="главы, напр. 1–5, 8" aria-label="Прочитанные главы: ' + esc(b.name) + '"></div>';
    });
  }
  h += '</div>';
  h += '<div class="card"><h3 style="margin-bottom:8px">Предпросчёт</h3><div id="balBox">' + balHTML(d) + '</div></div>';
  var errs = balance(draftParams(d), draftPre(d)).errors;
  h += '<div class="sticky-act"><button type="button" id="wcreate" class="btn block" data-act="wcreate"' + (errs.length ? ' disabled' : '') + '>Создать план</button></div>';
  return h + '</div>';
}
function wizRefresh() {
  var d = ui.wizard;
  if (!d) return;
  syncRate(d);
  var a = document.activeElement;
  var r = $('w-rate'), c = $('w-c');
  if (r && a !== r) r.value = trimNum(d.rate);
  if (c && a !== c) c.value = trimNum(d.c);
  if ($('balBox')) $('balBox').innerHTML = balHTML(d);
  var bt = $('wcreate');
  if (bt) bt.disabled = balance(draftParams(d), draftPre(d)).errors.length > 0;
  if ($('preN')) $('preN').textContent = draftPre(d).length;
}
function startWizard() { ui.wizard = newDraft(); ui.preOpen = false; syncRate(ui.wizard); }

/* ----- Отрисовка ----- */
function render(keep) {
  var plan = activePlan();
  if (!plan && !ui.wizard) startWizard();
  var scr = $('screen'), y = window.scrollY;
  $('tabbar').hidden = !!ui.wizard;
  $('app').classList.toggle('nobar', !!ui.wizard);
  Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function (b) {
    if (b.getAttribute('data-tab') === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  var f = {today:todayHTML, plan:planHTML, stats:statsHTML, settings:settingsHTML}[ui.tab] || todayHTML;
  scr.innerHTML = ui.wizard ? wizHTML() : f(plan);
  window.scrollTo(0, keep ? y : 0);
}

/* ----- Действия ----- */
function persist() { saveState(); }
function toggleKey(plan, key) {
  if (plan.done[key]) delete plan.done[key]; else plan.done[key] = BP.today();
}
function addBooksToStream(d, i, val) {
  var st = d.streams[i], fb = freeBooks(d), add = [];
  if (val === 'all') add = fb;
  else if (val.indexOf('cat:') === 0) add = fb.filter(function (b) { return b.cat === val.slice(4); });
  else add = fb.filter(function (b) { return b.id === val; });
  add.forEach(function (b) { st.books.push(b.id); });
}
function setPre(d, id, arr) {
  if (arr.length) d.pre[id] = arr; else delete d.pre[id];
}

function onClick(e) {
  if (e.target.closest('a')) return;
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act'), plan = activePlan(), d = ui.wizard;
  var g = function (k) { return el.getAttribute('data-' + k); };
  switch (act) {
    case 'tog': toggleKey(plan, g('key')); if (ui.pin == null) ui.pin = dayInfo(plan, BP.today()).day; persist(); render(true); return;
    case 'allday': {
      var dn = +g('d'), sl = daySlots(plan, dn), all = isDayDone(plan, dn);
      sl.forEach(function (s) { if (all) delete plan.done[s.key]; else if (!plan.done[s.key]) plan.done[s.key] = BP.today(); });
      if (ui.pin == null) ui.pin = dn;
      persist(); render(true); return;
    }
    case 'ahead': ui.pin = +g('d'); render(); return;
    case 'backtoday': ui.pin = null; render(); return;
    case 'cell': toggleKey(plan, g('book') + ':' + g('ch') + '#1'); persist(); render(true); return;
    case 'pview': ui.planView = g('v'); render(true); return;
    case 'coll': ui.collapsed[g('id')] = !ui.collapsed[g('id')]; render(true); return;
    case 'newplan': startWizard(); render(); return;
    case 'useplan': state.activeId = g('id'); ui.pin = null; persist(); render(true); return;
    case 'delask': ui.confirmDel = g('id'); render(true); return;
    case 'delno': ui.confirmDel = null; render(true); return;
    case 'delyes':
      state.plans = state.plans.filter(function (p) { return p.id !== g('id'); });
      if (state.activeId === g('id')) state.activeId = state.plans[0] ? state.plans[0].id : null;
      ui.confirmDel = null; ui.pin = null; persist();
      if (!state.plans.length) { ui.tab = 'today'; startWizard(); }
      render(); return;
    case 'policy': plan.params.missed = g('v'); ui.pin = null; persist(); render(true); return;
    case 'theme': state.theme = g('v'); applyTheme(); persist(); render(true); return;
    case 'copy': copyBackup(); return;
    case 'restore': {
      var txt = ($('rs') || {}).value || '';
      ui.restoreText = txt; ui.restoreMsg = '';
      var parsed = null;
      try { parsed = normalizeState(JSON.parse(txt)); } catch (err) { parsed = null; }
      if (!parsed || !parsed.plans.length) ui.restoreMsg = 'Не удалось прочитать копию. Проверьте, что вставлен весь текст.';
      else ui.restore = parsed;
      render(true); return;
    }
    case 'restoreno': ui.restore = null; render(true); return;
    case 'restoreyes':
      state = ui.restore; ui.restore = null; ui.restoreText = ''; ui.restoreMsg = ''; ui.pin = null;
      applyTheme(); persist(); toast('Копия восстановлена'); render(); return;
    /* мастер */
    case 'wcancel': ui.wizard = null; render(); return;
    case 'wpreset': d.preset = g('v'); d.streams = makeStreams(g('v')); syncRate(d); render(true); return;
    case 'sdel': d.streams.splice(+g('i'), 1); syncRate(d); render(true); return;
    case 'sadd': d.streams.push({id:'s' + (d.nextId++), name:'Раздел ' + (d.streams.length + 1), books:[]}); render(true); return;
    case 'bleft': case 'bright': {
      var arr = d.streams[+g('i')].books, k = arr.indexOf(g('b')), j = act === 'bleft' ? k - 1 : k + 1;
      if (k >= 0 && j >= 0 && j < arr.length) { var tmp = arr[k]; arr[k] = arr[j]; arr[j] = tmp; }
      render(true); return;
    }
    case 'brem': {
      var a2 = d.streams[+g('i')].books; a2.splice(a2.indexOf(g('b')), 1); syncRate(d); render(true); return;
    }
    case 'wset': d[g('k')] = g('v'); syncRate(d); render(true); return;
    case 'ptoggle': ui.preOpen = !ui.preOpen; render(true); return;
    case 'wcreate': {
      var bl = balance(draftParams(d), draftPre(d));
      if (bl.errors.length) return;
      var pl = BP.makePlan((d.name || '').trim() || 'План', draftParams(d), d.pre);
      state.plans.push(pl); state.activeId = pl.id; ui.wizard = null; ui.tab = 'today'; ui.pin = null;
      persist(); render(); return;
    }
  }
}
function onInput(e) {
  var el = e.target, d = ui.wizard;
  if (el.hasAttribute('data-note')) {
    var plan = activePlan(), k = el.getAttribute('data-note');
    if (el.value) plan.notes[k] = el.value; else delete plan.notes[k];
    persist(); return;
  }
  if (!d || !el.hasAttribute('data-w')) return;
  var w = el.getAttribute('data-w');
  if (w === 'name') d.name = el.value;
  else if (w === 'sname') d.streams[+el.getAttribute('data-i')].name = el.value;
  else if (w === 'days') { d.days = /^\d+$/.test(el.value.trim()) ? +el.value : NaN; wizRefresh(); }
  else if (w === 'rate') { d.rate = parseNum(el.value); d.rateMode = 'r'; wizRefresh(); }
  else if (w === 'c') { d.c = parseNum(el.value); d.rateMode = 'c'; wizRefresh(); }
  else if (w === 'date') { d.startDate = el.value; wizRefresh(); }
  if (w === 'sname') wizRefresh();
}
function onChange(e) {
  var el = e.target, d = ui.wizard;
  if (!d || !el.hasAttribute('data-w')) return;
  var w = el.getAttribute('data-w'), i = +el.getAttribute('data-i'), b = el.getAttribute('data-b');
  if (w === 'start') { d.streams[i].books = rotateBooks(d.streams[i].books, el.value); render(true); }
  else if (w === 'addbook') { if (el.value) { addBooksToStream(d, i, el.value); syncRate(d); render(true); } }
  else if (w === 'skip') { d.skipRead = el.checked; wizRefresh(); }
  else if (w === 'pfull') {
    var bk = bookById[b], arr = [];
    if (el.checked) for (var c = 1; c <= bk.ch; c++) arr.push(c);
    setPre(d, b, arr);
    var row = el.closest('.prow'), tx = row.querySelector('[data-w="ptxt"]');
    tx.value = formatRanges(arr); wizRefresh();
  } else if (w === 'ptxt') {
    var bk2 = bookById[b], a3 = parseChapters(el.value, bk2.ch);
    setPre(d, b, a3);
    el.value = formatRanges(a3);
    el.closest('.prow').querySelector('[data-w="pfull"]').checked = a3.length === bk2.ch;
    wizRefresh();
  }
}
function copyBackup() {
  var txt = JSON.stringify(state), ta = $('bk');
  var fallback = function () {
    try { ta.focus(); ta.select(); toast(document.execCommand('copy') ? 'Скопировано' : 'Текст выделен, скопируйте вручную'); }
    catch (err) { toast('Текст выделен, скопируйте вручную'); }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('Скопировано'); }, fallback);
    else fallback();
  } catch (err) { fallback(); }
}

/* ----- Запуск ----- */
$('screen').addEventListener('click', onClick);
$('screen').addEventListener('input', onInput);
$('screen').addEventListener('change', onChange);
$('tabbar').addEventListener('click', function (e) {
  var b = e.target.closest('[data-tab]');
  if (!b) return;
  ui.tab = b.getAttribute('data-tab'); ui.pin = null; ui.confirmDel = null; ui.restore = null; ui.restoreMsg = '';
  render();
});
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && !ui.wizard && ui.tab !== 'settings') { ui.pin = null; render(true); }
});
var lastW = window.innerWidth;
window.addEventListener('resize', function () {
  if (window.innerWidth !== lastW) { lastW = window.innerWidth; if (!ui.wizard && ui.tab === 'plan' && ui.planView === 'hex') render(true); }
});
loadState();
applyTheme();
render();

})();

</script>
<script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
